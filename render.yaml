# Render Blueprint: one Node web service serves both the API and the built
# frontend. Secrets are marked sync: false; set them in the Render dashboard.
services:
  - type: web
    name: celerity-relief
    runtime: node
    plan: free
    buildCommand: npm ci --prefix celerity-web && npm run build --prefix celerity-web && npm ci --prefix server --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COORDINATOR_KEY
        sync: false
      - key: SEED_RECEIVER_EMAILS
        sync: false
      - key: AGENT_RUNS_PER_HOUR
        value: "20"
